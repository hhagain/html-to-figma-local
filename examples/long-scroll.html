<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>连续长页捕获回归</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0f7;font:16px/24px Arial,sans-serif;color:#182230}.device{width:390px;height:620px;margin:20px auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:white;border-radius:18px}header{height:60px;flex-shrink:0;padding:18px;background:#dce9ff}#scroller{overflow-y:auto;flex:1;padding:12px}.block{height:350px;padding:16px;background:#f1f5fb;margin-bottom:12px}footer{height:50px;flex-shrink:0;padding:13px;background:#dce9ff}input{height:36px;width:100%;margin:12px 0}button{padding:10px 14px}#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;top:auto;width:320px;height:300px;padding:16px;background:white;display:flex;flex-direction:column;max-height:80vh}#sheet[hidden]{display:none}#sheet-scroll{height:180px;overflow:auto}#sheet-scroll p{height:300px}</style></head><body><article class="device"><header id="topbar">顶部导航唯一</header><main id="scroller"><div class="block"><h1>起始内容</h1><label>名称<input id="name" placeholder="输入名称"></label><button id="show-dialog" onclick="document.getElementById('sheet').hidden=false">打开长表单</button></div><div class="block"><h2>中间内容不可缺失</h2><p>第二段完整内容</p></div><div class="block"><h2>末尾内容</h2><p>第三段完整内容</p></div></main><footer id="bottombar">底部导航唯一</footer></article><section id="sheet" role="dialog" aria-modal="true" hidden><h2>长表单</h2><div id="sheet-scroll"><p>表单第一段</p><p>表单最后一段</p></div></section></body></html>
