<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>原画布排布回归样例</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e5e7eb;font:16px/24px Arial,sans-serif}.canvas{position:relative;width:1800px;height:2400px}.canvas>section{position:absolute;background:#fff;padding:16px}.phone{width:390px;height:844px;border-radius:24px;background:#f5f7fa!important}.tab{width:390px;height:52px;background:#202a44!important;color:#fff}.note{width:390px;height:148px;background:#fff5cf!important}h1,h2,p{margin:0}h2{font-size:20px;line-height:28px}.card{margin-top:24px;padding:20px;background:white;border-radius:12px}
</style></head>
<body><main class="canvas">
<section data-pencil-name="A-01 / 验证码主页" class="phone" style="left:0;top:420px"><h2>验证码</h2><div class="card">工作账号<p>123 456</p></div></section>
<section data-pencil-name="页签 / A-08" class="tab" style="left:0;top:1400px">A-08 · 更多操作</section>
<section data-pencil-name="色彩规范 / Color Palette" style="left:0;top:0;width:600px;height:300px;background:#dbeafe"><h1>色彩规范</h1></section>
<section data-pencil-name="A-02 / 验证码" class="phone" style="left:450px;top:420px"><h2>验证码已复制</h2><div class="card">操作成功</div></section>
<section data-pencil-name="注记 / A-08" class="note" style="left:0;top:1480px">注记与页面保留原有间距</section>
<section data-pencil-name="00 / 字体与组件规范" style="left:800px;top:0;width:900px;height:300px"><h1>字体与组件规范</h1></section>
<section data-pencil-name="功能分类" style="left:0;top:1800px;width:1800px;height:200px;background:#202a44;color:white"><h1>功能分类</h1></section>
<section data-pencil-name="源文件已有重叠" style="left:0;top:0;width:160px;height:40px;background:#fde68a">保留源文件的叠放</section>
</main></body></html>
