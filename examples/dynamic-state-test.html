<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>动态状态回归</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;color:#182335;background:#f6f8fb}.app{padding:32px;min-height:900px}button,input,select{font:inherit;padding:10px;border:1px solid #aab4c3;border-radius:6px;margin:8px}#dialog{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center}#dialog>div{width:400px;padding:24px;background:white;border-radius:14px}[hidden]{display:none!important}</style></head><body><main class="app"><h1>动态状态回归</h1><p id="status">默认状态</p><button id="open">打开详情</button><button id="mutate">尝试网络写请求</button><button id="increment">修改会话</button><p id="counter"></p><label>当前状态<select id="choice"><option value="all">全部</option><option value="active">生效中</option></select></label><label><input id="enabled" type="checkbox">已启用</label></main><div id="dialog" hidden><div><h2>详情弹窗</h2><input id="name" placeholder="输入名称"><p id="error" hidden>名称不能为空</p><button id="save">保存</button><button id="close">关闭</button></div></div><script>document.querySelector('#counter').textContent=localStorage.getItem('count')||'0';document.querySelector('#open').onclick=()=>document.querySelector('#dialog').hidden=false;document.querySelector('#close').onclick=()=>document.querySelector('#dialog').hidden=true;document.querySelector('#save').onclick=()=>{document.querySelector('#error').hidden=!!document.querySelector('#name').value};document.querySelector('#choice').onchange=e=>document.querySelector('#status').textContent=e.target.selectedOptions[0].textContent;document.querySelector('#increment').onclick=()=>{localStorage.setItem('count','1');document.querySelector('#counter').textContent='1'};document.querySelector('#mutate').onclick=()=>fetch('/mutation',{method:'POST',body:'test'}).catch(()=>document.querySelector('#status').textContent='写请求已阻止');</script></body></html>
