<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>产品页面分组回归</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;font:16px/24px Arial,sans-serif;color:#182230}.app{width:390px;min-height:600px;margin:24px auto;background:white;border-radius:20px;padding:20px}header nav{display:flex;gap:8px}button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:#edf1ff;color:#3657df;cursor:pointer}h1{font-size:22px}h2{font-size:18px}.scroll{height:330px;overflow:auto;border:1px solid #e2e8f0;padding:12px;margin:12px 0}.long{height:880px;background:linear-gradient(white,#edf1ff);padding:12px}dialog{width:320px;border:0;border-radius:16px;padding:24px}input{display:block;width:100%;height:40px;margin:12px 0;border:1px solid #d5dce7;border-radius:8px}dialog::backdrop{background:#0005}</style></head><body><div class="app"><header><nav aria-label="主要页面"><button id="nav-home" role="tab" data-action="tab" data-id="home">首页</button><button id="nav-planning" role="tab" data-action="tab" data-id="planning">计划</button></nav></header><main id="page"></main></div><dialog id="editor"><h2>新增计划</h2><form><label>计划名称<input name="name" required></label><button type="submit">提交</button><button type="button" onclick="editor.close()">关闭</button></form></dialog><script>
const page=document.getElementById('page'),editor=document.getElementById('editor');
function render(){const route=location.hash||'#/planning',module=route.includes('home')?'home':'planning';document.querySelectorAll('[role=tab]').forEach(n=>n.setAttribute('aria-selected',String(n.dataset.id===module)));if(route.includes('/detail/')){page.innerHTML='<h1>计划详情</h1><p>不同记录共用同一详情模板</p><button id="edit-detail" data-action="edit" onclick="editor.showModal()">编辑计划</button>';return;}page.innerHTML='<h1>'+(module==='home'?'首页':'计划')+'</h1><button id="add" data-action="add" onclick="editor.showModal()">新增计划</button><section><h2>预算</h2><button id="year" data-action="period" onclick="document.getElementById(\'period\').textContent=\'年度预算\'">年</button><button id="month" data-action="period" onclick="document.getElementById(\'period\').textContent=\'月度预算\'">月</button><p id="period">月度预算</p></section><button id="detail-one" data-action="detail" data-id="one" onclick="location.hash=\'#/planning/detail/one\'">查看计划详情一</button><button id="detail-two" data-action="detail" data-id="two" onclick="location.hash=\'#/planning/detail/two\'">查看计划详情二</button><div class="scroll" id="content"><div class="long"><p>长页面上半部分</p><p style="margin-top:710px">长页面下半部分</p></div></div>';}
document.querySelectorAll('[role=tab]').forEach(n=>n.onclick=()=>{location.hash='#/'+n.dataset.id;});window.onhashchange=render;document.querySelector('form').onsubmit=e=>e.preventDefault();render();
</script></body></html>
