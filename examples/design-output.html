<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设计稿整理样例</title><style>*{box-sizing:border-box}body{width:390px;margin:0;background:#f2f5fa;color:#202943;font:14px system-ui}nav{display:flex;background:#2858b8;color:white;padding:12px}button{font:inherit;border:0;border-radius:8px;padding:10px;background:#e8efff;color:#244eb5;cursor:pointer}nav button[aria-selected=true]{background:white}main{padding:16px}section{padding:16px;border-radius:16px;background:white;margin-bottom:16px}h1{font-size:20px}h2{font-size:15px}#amount{font-size:30px;font-weight:700;margin:10px 0}#chart{height:70px;display:flex;gap:10px;align-items:end}#chart i{width:18px;background:#cad8fa}#chart i.selected{background:#2c61d5}#dates{display:flex;gap:8px;margin:12px 0}details{padding:12px;background:#f5f7fb;border-radius:10px}input{display:block;width:100%;padding:10px;margin:8px 0}#message{color:#b12b35}#sheet{position:fixed;inset:80px auto auto 20px;width:min(350px,calc(100vw - 40px));background:white;border:1px solid #d9e0ef;border-radius:16px;padding:20px;box-shadow:0 16px 80px #28344c40}</style>
<nav data-primary-nav><button id="home" role="tab" aria-selected="true">首页</button><button id="settings" role="tab" aria-selected="false">设置</button></nav><main id="view"></main><section id="sheet" role="dialog" aria-modal="true" hidden></section>
<script>
const data=[{value:'72.00',date:'2026-10-13',name:'交通'},{value:'58.00',date:'2026-10-14',name:'餐饮'},{value:'120.50',date:'2026-10-15',name:'购物'},{value:'63.20',date:'2026-10-16',name:'文娱'}];let selected=0;
function renderHome(){view.innerHTML='<h1>首页</h1><section id="summary"><h2>每日支出</h2><p id="amount">¥'+data[selected].value+'</p><p id="date">'+data[selected].date+'</p><div id="chart">'+data.map((x,i)=>'<i class="'+(i===selected?'selected':'')+'" style="height:'+(25+i*10)+'px"></i>').join('')+'</div><div id="dates" role="list">'+data.map((x,i)=>'<button data-action="day" data-id="'+i+'" onclick="selected='+i+';renderHome()">'+x.date+'</button>').join('')+'</div><button id="detail" onclick="openSheet()">查看详情</button></section><section id="filters"><h2>筛选器</h2><details id="advanced"><summary>展开筛选</summary><label>关键词<input id="query"></label><button id="empty" onclick="document.querySelector(\'#records\').innerHTML=\'<p class=empty>暂无记录</p>\'">无结果示例</button></details></section><section id="records"><h2>记录</h2><p>'+data[selected].name+'</p></section>';}
function openSheet(){sheet.hidden=false;sheet.innerHTML='<h2>记录详情</h2><p>¥'+data[selected].value+'</p><form novalidate><label>备注<input id="note" name="note" required></label><button id="save" type="submit">保存</button><p id="message"></p></form>';sheet.querySelector('form').onsubmit=e=>{e.preventDefault();message.textContent='备注不能为空';message.setAttribute('role','alert');};}
home.onclick=()=>{home.setAttribute('aria-selected','true');settings.setAttribute('aria-selected','false');renderHome();};settings.onclick=()=>{settings.setAttribute('aria-selected','true');home.setAttribute('aria-selected','false');view.innerHTML='<h1>设置</h1><section id="preferences"><h2>显示设置</h2><label><input id="notifications" type="checkbox">通知</label></section>';};renderHome();
</script></html>
