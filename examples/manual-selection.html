<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>手动标记示例</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f3f5f7;color:#20332a}header{position:relative;height:68px;padding:14px 20px;background:white;border-bottom:1px solid #dce4df}button{font:inherit;padding:6px 14px;border:1px solid #b6ccbf;border-radius:6px;background:white;color:#24503a;cursor:pointer}button[aria-pressed=true]{background:#24503a;color:white}main{padding:20px;max-width:760px}h1{font-size:26px;margin:0 0 18px}.card{padding:18px;background:white;border:1px solid #dce4df;border-radius:12px;margin-bottom:18px}label{display:block;margin-bottom:10px}input,select{font:inherit;padding:6px;border:1px solid #b6ccbf;border-radius:6px;width:240px}details{margin-top:16px}summary{cursor:pointer}svg{width:24px;height:24px;vertical-align:middle}.local-list{height:120px;overflow:auto;border:1px solid #dce4df;padding:10px;margin-top:18px}.local-list p{margin:6px 0}.spacer{height:850px;background:linear-gradient(#e6ede8,transparent);margin-top:20px;padding:20px}dialog{border:1px solid #b6ccbf;border-radius:14px;padding:24px;width:340px}dialog::backdrop{background:#17291e60}dialog h2{margin:0 0 12px}footer{padding:24px;background:#e6ede8}
</style></head><body><header><nav aria-label="主导航"><button id="home" aria-pressed="true">概览</button> <button id="records" aria-pressed="false">记录</button></nav></header><main><h1 id="heading">概览</h1><section class="card" data-h2f-component="筛选卡片"><label>备注 <input id="note" placeholder="输入备注"></label><label>范围 <select id="range"><option value="month">本月</option><option value="year">本年</option></select></label><button id="change">更换示例数值</button> <button id="open">打开详情</button><p id="amount">72</p><details id="more"><summary>展开筛选</summary><label>关键词 <input id="keyword" placeholder="关键词"></label><button id="apply">应用</button></details></section><article class="card" data-h2f-component="记录项"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" fill="none" stroke="#285640" stroke-width="2"/></svg> 已完成<span class="value">72</span></article><article class="card" data-h2f-component="记录项"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" fill="none" stroke="#285640" stroke-width="2"/></svg> 待复核<span class="value">58</span></article><div class="local-list" data-h2f-preserve-scroll><p>局部列表 1</p><p>局部列表 2</p><p>局部列表 3</p><p>局部列表 4</p><p>局部列表 5</p><p>局部列表 6</p><p>局部列表 7</p><p>局部列表 8</p></div><div class="spacer">长页中段 · 主页面内容</div><section class="card"><h2>页面末尾</h2><p>此处应只在完整长页或滚动后的当前页面中出现。</p></section></main><footer>长页面底部</footer><dialog id="detail"><h2>记录详情</h2><label>说明 <input id="description" value="详情状态"></label><button id="close">关闭</button></dialog><script>
const one=s=>document.querySelector(s);one('#home').onclick=()=>{one('#home').setAttribute('aria-pressed','true');one('#records').setAttribute('aria-pressed','false');one('#heading').textContent='概览';location.hash='/home';};one('#records').onclick=()=>{one('#home').setAttribute('aria-pressed','false');one('#records').setAttribute('aria-pressed','true');one('#heading').textContent='记录';location.hash='/records';};one('#change').onclick=()=>{one('#amount').textContent=one('#amount').textContent==='72'?'58':'72';};one('#open').onclick=()=>one('#detail').showModal();one('#close').onclick=()=>one('#detail').close();one('#range').onchange=()=>one('#amount').textContent=one('#range').value==='year'?'128':'72';
</script></body></html>
