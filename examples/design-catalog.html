<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>页面优先与组件目录样例</title><style>*{box-sizing:border-box}body{margin:0;width:390px;background:#f2f5fa;color:#24304a;font:14px system-ui}nav{display:flex;gap:4px;padding:10px;background:#3054ad}button{font:inherit;cursor:pointer}nav button{border:0;border-radius:8px;padding:8px;color:white;background:transparent}nav button[aria-pressed=true]{background:white;color:#3054ad}main{padding:16px}h1{font-size:20px}.list-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid #e4e9f1;border-radius:12px;background:white;margin:10px 0;text-align:left;color:#24304a}.tile{display:grid;place-items:center;width:32px;height:32px;border-radius:8px}.copy{display:flex;flex-direction:column}.copy small{font-size:11px;color:#6b7382}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#new,#change{padding:10px;border:0;border-radius:8px;background:#e5edff;color:#3054ad}#dialog{position:fixed;inset:20px auto auto 12px;width:366px;max-height:840px;overflow:auto;background:white;border:1px solid #ccd7ec;border-radius:16px;padding:20px;box-shadow:0 12px 80px #15244645}#dialog h2{font-size:18px;margin-top:0}label{display:block;margin:16px 0}input{display:block;width:100%;padding:10px;border:1px solid #cbd6e8;border-radius:7px;margin-top:6px}#accounts{display:flex;gap:8px}#accounts .list-row{display:flex;justify-content:center;margin:0;padding:8px}#accounts .list-row[aria-checked=true]{outline:2px solid #3b64c8}#error{color:#c23b3b}form>button{display:block;width:100%;padding:12px;background:#3054ad;color:white;border:0;border-radius:8px}</style>
<header><nav data-primary-nav id="navigation"></nav></header><main id="view"></main><section id="dialog" role="dialog" aria-modal="true" hidden></section>
<script>
const navigation=document.querySelector('#navigation'),view=document.querySelector('#view'),dialog=document.querySelector('#dialog');
const tabs=['概览','项目','账单','统计','设置'],glyphs={bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 10h16M7 18v3m10-3v3M8 14h.01M16 14h.01"/>',food:'<path d="M5 3v7m3-7v7m-6-7v7h6M5 10v11M17 3v18m0-18c-5 2-5 10 0 10"/>',bag:'<path d="M5 7h14v14H5zM9 7V4h6v3"/>'};
const icon=(name,color='#3863c7')=>`<svg aria-hidden="true" data-icon="${name}" viewBox="0 0 24 24" style="color:${color}">${glyphs[name]}</svg>`;
let active=0;function render(){navigation.innerHTML=tabs.map((name,i)=>`<button data-action="tab" data-id="${i}" aria-pressed="${i===active}">${name}</button>`).join('');view.innerHTML=`<h1>${tabs[active]}</h1><button id="new">新增订阅</button><section id="rows">${Array.from({length:12},(_,i)=>{const type=['bus','food','bag'][i%3],name=['交通出行','餐费','日用品'][i%3],color=['#3767cb','#a87e24','#7356bb'][i%3];return `<button class="list-row" data-action="record" data-id="${i}"><span class="tile" style="color:${color};background:${['#eff4ff','#fff7e3','#f4efff'][i%3]}">${icon(type,color)}</span><span class="copy"><strong>${name}</strong><small>示例记录 ${i+1}</small></span><strong>¥${72+i}.00</strong></button>`;}).join('')}</section>`;}
function openForm(){dialog.hidden=false;dialog.innerHTML=`<h2>新增订阅</h2><form novalidate><label>金额<input id="amount" name="amount" type="number" required></label><label>订阅名称<input id="title" name="title" required></label><fieldset><legend>支付方式</legend><div id="accounts" role="radiogroup">${['bus','food','bag'].map((name,i)=>`<button type="button" class="list-row" data-action="bank" data-id="${i}" role="radio" aria-checked="${i===0}">${icon(name)}<span>账户 ${i+1}</span></button>`).join('')}</div></fieldset><p id="error" role="alert" hidden>请填写订阅名称</p><button type="submit" id="save">保存订阅</button></form>`;dialog.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#error').hidden=false;document.querySelector('#title').setAttribute('aria-invalid','true');};}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.action==='tab'){active=Number(b.dataset.id);render();}else if(b.id==='new')openForm();else if(b.dataset.action==='bank'){document.querySelectorAll('[data-action="bank"]').forEach(el=>el.setAttribute('aria-checked',String(el===b)));}});render();
</script></html>
