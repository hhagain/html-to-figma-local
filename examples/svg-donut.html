<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SVG 环形图回归样例</title>
<style>body{margin:0;padding:24px;background:#f1f4fa;font:14px system-ui;color:#202743}.cards{display:flex;gap:24px;width:max-content}.card{width:260px;padding:20px;background:white;border-radius:18px;box-shadow:0 8px 28px #20305014}svg{display:block;width:96px;height:96px;margin:auto}.track{stroke:#e0e5f0;fill:none;stroke-width:20}.arc{fill:none;stroke-width:20;transform:rotate(-90deg);transform-origin:80px 80px}text{fill:#202743;font:650 28px system-ui;text-anchor:middle;dominant-baseline:middle}</style>
<div id="cards" class="cards"><section class="card"><p>预算使用进度</p><svg id="ring79" viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="58"/><circle class="arc" cx="80" cy="80" r="58" pathLength="100" stroke="#345bdd" stroke-dasharray="79 100"/><text x="80" y="83">79%</text></svg></section><section class="card"><p>多分类占比</p><svg id="ring153" viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="58"/><circle cx="80" cy="80" r="58" fill="none" stroke="#345bdd" stroke-width="20" pathLength="100" stroke-dasharray="54 100" transform="rotate(-90 80 80)"/><circle cx="80" cy="80" r="58" fill="none" stroke="#5e6a8c" stroke-width="20" pathLength="100" stroke-dasharray="27 100" stroke-dashoffset="-54" transform="rotate(-90 80 80)"/><circle cx="80" cy="80" r="58" fill="none" stroke="#b35a2b" stroke-width="20" pathLength="100" stroke-dasharray="12 100" stroke-dashoffset="-81" transform="rotate(-90 80 80)"/><circle cx="80" cy="80" r="58" fill="none" stroke="#7546c4" stroke-width="20" pathLength="100" stroke-dasharray="7 100" stroke-dashoffset="-93" transform="rotate(-90 80 80)"/><text x="80" y="83">153%</text></svg></section></div></html>
