<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>创建分组 outline 回归</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f5f7fa;font:15px/21px Arial,sans-serif;color:#182230}#dialog{width:358px;height:262px;padding:20px;background:white;border-radius:16px;display:flex;flex-direction:column;gap:12px}h2,p{margin:0}h2{font-size:18px;line-height:26px;text-align:center}#field{width:318px;height:48px;padding:13.5px 16px;flex-shrink:0;display:flex;flex-direction:column;background:white;outline:1px solid #e5eaf0;outline-offset:-.5px;border-radius:12px}#field-label{width:286px;height:21px}#actions{display:flex;gap:10px;height:50px;flex-shrink:0}.button{width:154px;height:50px;display:flex;flex-direction:column;padding:13px 10px;border-radius:25px;font:600 17px/24px Arial,sans-serif}.button>span{display:block;width:134px;height:24px;text-align:center}#cancel{background:white;color:#1175f2;outline:1px solid #1175f2;outline-offset:-.5px}#create{background:#1175f2;color:white}
</style></head><body><section id="dialog"><h2>创建分组</h2><p>名称</p><div id="field"><div id="field-label">工作</div></div><div id="actions"><div class="button" id="cancel"><span>取消</span></div><div class="button" id="create"><span>创建</span></div></div></section></body></html>
